services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: docker123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdocker123"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-service:
    build: ./users-service
    ports:
      - "3001:3001"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: docker123
      DB_NAME: users_db
      DB_PORT: 3306
      PORT: 3001
    depends_on:
      mysql:
        condition: service_healthy

  academic-service:
    build: ./academic-service
    ports:
      - "4000:4000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: docker123
      DB_NAME: academic_db
      DB_PORT: 3306
      PORT: 4000
      USERS_SERVICE_URL: http://users-service:3001
    depends_on:
      mysql:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: 8192
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:1.5b && wait"]
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      ACADEMIC_SERVICE_URL: http://academic-service:4000
      USERS_SERVICE_URL: http://users-service:3001
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
      AI_MODEL: ${AI_MODEL:-qwen2.5:1.5b}
      AI_API_KEY: ${AI_API_KEY:-ollama}
    depends_on:
      - academic-service
      - users-service
      - ollama
    restart: unless-stopped

  frontend:
    build: ./plataforma-inscripciones-frontend
    ports:
      - "3000:3000"
    depends_on:
      - users-service
      - academic-service
      - ai-service

volumes:
  mysql_data:
  ollama_data: