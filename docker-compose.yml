version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: docker123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdocker123"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-service:
    build: ./users-service
    ports:
      - "3001:3001"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: docker123
      DB_NAME: users_db
      DB_PORT: 3306
      PORT: 3001
    depends_on:
      mysql:
        condition: service_healthy

  academic-service:
    build: ./academic-service
    ports:
      - "4000:4000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: docker123
      DB_NAME: academic_db
      DB_PORT: 3306
      PORT: 4000
      USERS_SERVICE_URL: http://users-service:3001
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./plataforma-inscripciones-frontend
    ports:
      - "3000:3000"
    depends_on:
      - users-service
      - academic-service

volumes:
  mysql_data: